# Engineering-blog feeds for the practitioner-proof screen
# (scripts/screens/eng_blog_proof.py).
#
# WHY: EDGAR language is written for investors and — once a screen like ours is
# known — FOR the screen. An engineering blog is written for engineers, who
# notice hollow claims. This is the corroborating layer: it asks whether a
# company writes like an org that actually OPERATES models (eval harnesses,
# token budgets, retrieval, hallucination mitigation) rather than one that
# markets them ("AI-powered", "harness the power of").
#
# STATUS 2026-08-20: seeded and HTTP-VERIFIED. 18 of 26 candidates returned 2xx
# and are marked verified: true. The rest are recorded with their failure code
# so the gap is visible rather than silently absent — deliberately NOT repeating
# the config/ir_feeds.yaml situation where most entries were never verified.
#
# Asymmetry, same as the MCP screen: presence is strong evidence, absence is
# weak. An unresolved feed is a TODO, never a negative on the company.

