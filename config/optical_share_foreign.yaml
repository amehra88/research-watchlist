# Quarterly revenue for non-EDGAR optical names, in CNY millions.
#
# WHY A FILE. The US side comes from Store B `metrics` (FactSet-sourced, already in pg).
# The Chinese names have no FactSet quarterly series we can reach from a cron script, so
# their figures are recorded here with PROVENANCE on every point. Refresh from CNINFO
# (scripts/v3_ingest/cninfo_filings.py) or FactSet StreetAccount when new quarters land.
#
# CHINESE REPORTING CONVENTION: A-shares file Q1, H1 (cumulative), Q3 (9M cumulative) and
# annual. Where a source gives a cumulative figure, derive the standalone quarter and say so
# in `note`. Never mix cumulative and standalone silently.
#
# calendar_quarter is the CALENDAR quarter end the figure belongs to, so it joins directly
# against the US series.

companies:
  innolight.cn:
    name: Zhongji Innolight
    pure_play_datacom: true          # optical transceivers only
    currency: CNY
    quarters:
      - calendar_quarter: 2025-06-30
        revenue_mn: 14790
        source: "FactSet StreetAccount — H1'25 revenue CNY14.79B, +37% vs CNY10.80B"
        note: "CUMULATIVE H1, not a standalone quarter. Do not use until split."
        cumulative: true
      - calendar_quarter: 2025-09-30
        revenue_mn: 10220
        source: "FactSet StreetAccount — Reports Q3: Revenue CNY10.22B vs FactSet CNY10.75B [5 est]"
        cumulative: false
      - calendar_quarter: 2025-12-31
        revenue_mn: 37456
        source: "CNINFO FY2025 annual report — 营业收入 37,456,518,745.90"
        note: "FULL YEAR figure. Standalone Q4 = FY minus 9M; 9M not yet recorded."
        cumulative: true
      - calendar_quarter: 2026-03-31
        revenue_mn: 19500
        source: "FactSet StreetAccount — Reports Q1: Revenue CNY19.50B vs FactSet CNY14.71B [4 est]"
        cumulative: false
  eoptolink.cn:
    name: Eoptolink Technology
    pure_play_datacom: true
    currency: CNY
    quarters:
      - calendar_quarter: 2025-06-30
        revenue_mn: 10440
        source: "FactSet StreetAccount — H1'25 revenue CNY10.44B vs year-ago CNY2.73B"
        note: "CUMULATIVE H1."
        cumulative: true
      - calendar_quarter: 2025-09-30
        revenue_mn: 6070
        source: "FactSet StreetAccount — Reports Q3: Revenue CNY6.07B vs FactSet CNY7.41B [2 est]"
        cumulative: false
      - calendar_quarter: 2025-12-31
        revenue_mn: 24842
        source: "CNINFO FY2025 annual report — full-year revenue RMB 24,841,854,840 (+187.29%)"
        note: "FULL YEAR figure."
        cumulative: true

# Names we want but do not yet have a quarterly series for.
missing:
  - id: accelink.cn
    why: "CNINFO channel has not run live yet; Accelink is the key name for in-house laser capability"
  - ticker: AAOI
    why: "not in Store B metrics (80-ticker universe predates it as a comparable); needs a FactSet pull or SEC extraction"
  - ticker: FN
    why: "same as AAOI"
