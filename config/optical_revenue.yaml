# Quarterly revenue, USD millions, by CALENDAR quarter end. Source: FactSet FF_SALES,
# periodicity=QTR, currency=USD, pulled 2026-08-21. Audit cards available per point via
# FF_SALES(QTR,<date>,<date>,,RP,USD) on the FactSet identifier.
#
# WHY A FILE. FactSet is reachable via MCP in an interactive session but NOT from cron, so
# the series is snapshotted here and refreshed deliberately. Re-pull when new quarters land.
#
# WHY USD FROM FACTSET rather than converting CNY ourselves: removes the FX assumption
# entirely. An earlier version divided CNY by an assumed ~7.2 and was accurate to ~1%, but
# assumed rather than sourced.
#
# ROLE is load-bearing for the share math — "you can't just look at headline revenue":
#   module_maker  competes head-to-head in datacom transceivers. The share numerator/denominator.
#   component     sells INTO module makers (lasers, chips, subsystems). Different layer.
#   contract_mfr  BUILDS modules for the module makers. Its revenue OVERLAPS theirs, so
#                 including it double-counts. Excluded from share by default.
#   diversified   material non-optical revenue; totals overstate its optical position.
#
# PURITY: fraction of revenue that is datacom optics, where known. null = unknown, and the
# script will say so rather than assume 1.0.

companies:
  COHR:
    name: Coherent
    bloc: US
    role: module_maker
    # SOLVED from the FY2026 10-K (accession 0000820318-26-000020). Coherent RECAST its
    # segments: it now reports "Datacenter & Communications" (transceivers, co-packaged
    # optics, optical circuit switches, modules, components) vs "Industrial", and states
    # prior periods were recast to conform — so the history is consistent.
    #   FY ending    D&C      Industrial   total     datacom purity
    #   2024-06-30   2,631    2,076        4,708     55.9%
    #   2025-06-30   3,755    2,055        5,810     64.6%
    #   2026-06-30   5,275    1,844        7,118     74.1%
    # External segment revenue, source in $000s converted to USD millions.
    purity_by_fiscal_year: {2024: 0.559, 2025: 0.646, 2026: 0.741}
    purity_source: "FY2026 10-K segment note; COHR fiscal year ends 30 June"
    factset_id: COHR-US
    quarters: {2024-03-31: 1208.8, 2024-06-30: 1314.4, 2024-09-30: 1348.1, 2024-12-31: 1434.7,
               2025-03-31: 1497.9, 2025-06-30: 1529.4, 2025-09-30: 1581.4, 2025-12-31: 1685.6,
               2026-03-31: 1805.6, 2026-06-30: 2045.5}
  LITE:
    name: Lumentum
    bloc: US
    role: module_maker
    # NOT OBTAINABLE from filings, checked 2026-08-21 against the FY2026 10-K
    # (accession 0001628280-26-057358). Lumentum COLLAPSED TO A SINGLE reportable segment
    # as of Q1 FY2026, and its ASC 606 disaggregation is by product type — Components
    # $2,006mn / Systems $1,008mn in FY26 — not by market. The filing states Lumentum
    # "does not present disaggregation by customer, markets, or other dimensions."
    # A datacom/telecom split for LITE can only come from transcript commentary.
    # (Validation: disclosed FY26 total $3,014mn equals the sum of the four FactSet
    #  quarters below, so the quarterly series is sound.)
    purity: null
