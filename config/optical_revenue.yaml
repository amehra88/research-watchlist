# Quarterly revenue, USD millions, by CALENDAR quarter end. Source: FactSet FF_SALES,
# periodicity=QTR, currency=USD, pulled 2026-08-21. Audit cards available per point via
# FF_SALES(QTR,<date>,<date>,,RP,USD) on the FactSet identifier.
#
# WHY A FILE. FactSet is reachable via MCP in an interactive session but NOT from cron, so
# the series is snapshotted here and refreshed deliberately. Re-pull when new quarters land.
#
# WHY USD FROM FACTSET rather than converting CNY ourselves: removes the FX assumption
# entirely. An earlier version divided CNY by an assumed ~7.2 and was accurate to ~1%, but
# assumed rather than sourced.
#
# ROLE is load-bearing for the share math — "you can't just look at headline revenue":
#   module_maker  competes head-to-head in datacom transceivers. The share numerator/denominator.
#   component     sells INTO module makers (lasers, chips, subsystems). Different layer.
#   contract_mfr  BUILDS modules for the module makers. Its revenue OVERLAPS theirs, so
#                 including it double-counts. Excluded from share by default.
#   diversified   material non-optical revenue; totals overstate its optical position.
#
# PURITY: fraction of revenue that is datacom optics, where known. null = unknown, and the
# script will say so rather than assume 1.0.

companies:
  COHR:
    name: Coherent
    bloc: US
    role: module_maker
    # SOLVED from the FY2026 10-K (accession 0000820318-26-000020). Coherent RECAST its
    # segments: it now reports "Datacenter & Communications" (transceivers, co-packaged
    # optics, optical circuit switches, modules, components) vs "Industrial", and states
    # prior periods were recast to conform — so the history is consistent.
    #   FY ending    D&C      Industrial   total     datacom purity
    #   2024-06-30   2,631    2,076        4,708     55.9%
    #   2025-06-30   3,755    2,055        5,810     64.6%
    #   2026-06-30   5,275    1,844        7,118     74.1%
    # External segment revenue, source in $000s converted to USD millions.
    purity_by_fiscal_year: {2024: 0.559, 2025: 0.646, 2026: 0.741}
    purity_source: "FY2026 10-K segment note; COHR fiscal year ends 30 June"
    # ACTUAL QUARTERLY Datacenter & Communications revenue, from the 10-Qs (three-month
    # column, not year-to-date). Totals reconcile to the cent against the FactSet quarterly
    # series, which cross-validates both sources.
    #   quarter      D&C     Industrial  total     purity
    #   2025-09-30   1,090   491         1,581.378  68.9%   10-Q 2025-11-05
    #   2025-12-31   1,208   478         1,685.629  71.7%   10-Q 2026-02-04
    #   2026-03-31   1,362   444         1,805.641  75.4%   10-Q 2026-05-06
    # Earlier quarters are not directly available: the two-segment structure took effect
    # July 2025, so pre-FY2026 quarters would need the old Networking/Materials/Lasers
    # basis or the 10-K recast annuals.
    datacom_quarters: {2025-09-30: 1090, 2025-12-31: 1208, 2026-03-31: 1362}
    datacom_source: "COHR 10-Q segment notes, three-month columns"
    factset_id: COHR-US
    quarters: {2024-03-31: 1208.8, 2024-06-30: 1314.4, 2024-09-30: 1348.1, 2024-12-31: 1434.7,
               2025-03-31: 1497.9, 2025-06-30: 1529.4, 2025-09-30: 1581.4, 2025-12-31: 1685.6,
               2026-03-31: 1805.6, 2026-06-30: 2045.5}
  LITE:
    name: Lumentum
    bloc: US
    role: module_maker
    # NOT OBTAINABLE from filings, checked 2026-08-21 against the FY2026 10-K
    # (accession 0001628280-26-057358). Lumentum COLLAPSED TO A SINGLE reportable segment
    # as of Q1 FY2026, and its ASC 606 disaggregation is by product type — Components
    # $2,006mn / Systems $1,008mn in FY26 — not by market. The filing states Lumentum
    # "does not present disaggregation by customer, markets, or other dimensions."
    # A datacom/telecom split for LITE can only come from transcript commentary.
    # (Validation: disclosed FY26 total $3,014mn equals the sum of the four FactSet
    #  quarters below, so the quarterly series is sound.)
    # Filings give NO market split (single segment since Q1 FY2026; ASC 606 disaggregation
    # is Components/Systems only). Transcripts give a number but it should NOT be applied
    # naively — checked 2026-08-21:
    #   Analyst, Q4 FY2025 call: LITE's own OFC investor-briefing slide showed telecom and
    #   datacom EACH at ~45% at a >$500mn/qtr revenue level.
    #   BUT Wupen Yuen, LITE President of Cloud and Networking, same call: "the demand is
    #   really mostly coming from the hyperscalers on the cloud. So even though the customers
    #   are traditional telecom customers, but the source of demand really is on the cloud."
    # So LITE's "telecom" bucket is substantially AI/cloud demand routed through telecom
    # customers. Stripping it out as non-datacom would OVERSTATE the correction and understate
    # LITE's AI exposure. Left unadjusted deliberately.
    purity: null
    purity_status: disclosed_but_misleading
    purity_note: "~45% datacom per OFC slide, but management states telecom demand is
                  largely cloud-sourced; a naive split misrepresents the business"
    factset_id: LITE-US
    quarters: {2024-03-31: 366.5, 2024-06-30: 308.3, 2024-09-30: 336.9, 2024-12-31: 402.2,
               2025-03-31: 425.2, 2025-06-30: 480.7, 2025-09-30: 533.8, 2025-12-31: 665.5,
               2026-03-31: 808.4, 2026-06-30: 1006.3}
  AAOI:
    name: Applied Optoelectronics
    bloc: US
    role: module_maker
    # Disclosed on every earnings call. Q2 2025: "54% of revenue was from CATV products, 44%
    # was from data center products, with the remaining 2% from FTTH, Telecom and other"
    # (datacenter revenue $44.8mn). By May 2026 management: "Data center surpassed our cable
    # TV business for the first time in a while." So purity runs ~44% and rising through 50%.
    # Quarter-by-quarter figures are extractable from the calls; only these anchors recorded.
    purity_anchors: {2025-06-30: 0.44, 2026-03-31: 0.50}
    purity_status: disclosed_in_transcripts
    purity_source: "AAOI Q2 2025 and Q1/Q2 2026 earnings calls (FactSet CallStreet)"
    factset_id: AAOI-US
    quarters: {2024-03-31: 40.7, 2024-06-30: 43.3, 2024-09-30: 65.2, 2024-12-31: 100.3,
               2025-03-31: 99.9, 2025-06-30: 103.0, 2025-09-30: 118.6, 2025-12-31: 134.3,
               2026-03-31: 151.1, 2026-06-30: 191.9}
  innolight.cn:
    name: Zhongji Innolight
    bloc: CN
    role: module_maker
    purity: null        # near pure-play datacom transceivers
    factset_id: 300308-CN
    quarters: {2024-03-31: 673.7, 2024-06-30: 822.4, 2024-09-30: 908.8, 2024-12-31: 911.0,
               2025-03-31: 917.2, 2025-06-30: 1121.9, 2025-09-30: 1427.3, 2025-12-31: 1866.6,
               2026-03-31: 2815.7}
  eoptolink.cn:
    name: Eoptolink Technology
    bloc: CN
    role: module_maker
    purity: null        # near pure-play optical modules
    factset_id: 300502-CN
    quarters: {2024-03-31: 154.8, 2024-06-30: 222.4, 2024-09-30: 335.2, 2024-12-31: 489.1,
               2025-03-31: 556.9, 2025-06-30: 882.7, 2025-09-30: 847.7, 2025-12-31: 1175.8,
               2026-03-31: 1204.2}

