# ---------------------------------------------------------------------------
# macro_policy (4) -- rule 4: always 0
# ---------------------------------------------------------------------------
ai_regulation: 0
antitrust_action: 0
china_us_tensions: 0
fed_policy_tech: 0

# ---------------------------------------------------------------------------
# competition_slugs (RIS5 A4 fix 0) -- every watchlist theme with competition/
# competitive/market-share semantics, listed explicitly rather than pattern-matched
# at runtime. These all stay polarity 0 above (rule 2: a competition theme firing is
# two-sided, it doesn't confirm or challenge on its own) -- this list is a SEPARATE,
# additive routing signal insider_pull.py uses only for the challenge direction: an
# insider-selling cluster on a name whose thesis includes a live competition theme is
# evidence worth attaching to that competitive-advantage assumption, regardless of
# which way the theme itself points. theme_polarity.py validates every entry here is
# a real config/watchlist.yaml theme slug.
# ---------------------------------------------------------------------------
competition_slugs:
  - autonomous_vehicle_competition
  - chip_design_competition
  - cybersecurity_competitive_landscape
  - frontier_model_competition
  - handset_competition
  - hbm_competitive_landscape
  - humanoid_robotics_competition
  - laser_architecture_competition
  - networking_competitive_landscape
  - observability_competitive_landscape
  - platform_take_rate       # market-share/take-rate semantics, not literally "competition" in the name
  - silicon_architecture_competition
