# Trigger phrases — OPERATOR-OWNED. The system reads this file and never writes it,
# the same rule as watchlist.yaml. Cut freely; every phrase here is a proposal.
#
# Governing principle (scripts/screens/edgar_ai_language_screen.py): rarity == precision.
# "artificial intelligence" hits 4,194 10-Ks (noise); "AI revenue" hits 5 (signal).
# weight = how costly the phrase is to say falsely. Measured 2026-09-15 on
# InsiderScore search_filings over TSCRIPT bodies, >$5B mcap:
#   "step function"  ~20 hits/month, ~1/3 NEGATED ("not a step function") — the
#                    screen strips negated hits before scoring
#   "supply constrained" high signal in this universe (NVDA, AVGO, MU, COHR, ANET)
#
# A hit is scored only when it is (i) in this list, (ii) actually present in the
# returned sentence (the vendor's boolean matches at DOCUMENT level, so rows arrive
# whose snippet contains only one term), (iii) not negated, (iv) tagged by who said
# it — management CLAIMING an inflection is a different signal from an analyst
# ASKING about one — and (v) flagged NEW only if the filer was observed in each of
# the prior two quarters and never said it (the newly_said predicate).

mcap_floor: 5000000000        # US$; below this the universe is too noisy to read
lookback_days: 7              # trailing window per run (weekday cron)
max_hits_per_phrase: 40       # InsiderScore `limit`

groups:
  upside:                     # management claiming acceleration
    - {phrase: "inflection point", weight: 4}
    - {phrase: "inflecting", weight: 4}
    - {phrase: "step function", weight: 3}
    - {phrase: "ahead of our expectations", weight: 3}
    - {phrase: "ahead of plan", weight: 3}
    - {phrase: "supply constrained", weight: 3}
    - {phrase: "capacity constrained", weight: 3}
    - {phrase: "sold out", weight: 3}
    - {phrase: "on allocation", weight: 4}
    - {phrase: "record backlog", weight: 3}
    - {phrase: "book-to-bill", weight: 2}
    - {phrase: "design win", weight: 2}      # 12-18 months ahead of revenue
    - {phrase: "production ramp", weight: 2}
    - {phrase: "pulled forward", weight: 3}
    - {phrase: "never seen", weight: 2}
    - {phrase: "raising our guidance", weight: 4}

  downside:                   # deceleration, hedging, guide-down precursors
    - {phrase: "subject to macro", weight: 4}
    - {phrase: "digestion", weight: 3}
    - {phrase: "air pocket", weight: 4}
    - {phrase: "elongated sales cycles", weight: 4}
    - {phrase: "longer sales cycles", weight: 3}
    - {phrase: "pushed out", weight: 3}
    - {phrase: "slipped into", weight: 3}
    - {phrase: "additional approvals", weight: 3}
    - {phrase: "deal scrutiny", weight: 3}
    - {phrase: "withdrawing guidance", weight: 5}
    - {phrase: "suspending guidance", weight: 5}
    - {phrase: "wider range", weight: 2}

  regime:                     # change in what is disclosed or how
    - {phrase: "structural change", weight: 3}
    - {phrase: "new normal", weight: 2}
    - {phrase: "no longer providing", weight: 4}
    - {phrase: "going forward we will disclose", weight: 3}
    - {phrase: "changing how we report", weight: 4}
