# GitHub orgs for the MCP-usage screen (scripts/screens/github_mcp_usage.py).
#
# WHY THIS FILE EXISTS: EDGAR language is a claim written for investors — and,
# once a screen like ours is known, written FOR the screen. Public repo activity
# is evidence produced for practitioners, who notice fakery. This maps a ticker
# to the GitHub org where that evidence would live.
#
# CURATION STATUS: seeded 2026-08-20 from the top of the MCP filing screen.
# Orgs marked `verified: false` are BEST GUESSES from company name and have not
# been confirmed — a wrong org produces a false "no repo found", which the
# script reports as weak evidence rather than a negative. Confirm before relying
# on any absence.
#
# Absence is weak evidence; presence is strong. Use to CONFIRM, never to reject.

